services:
  - type: web
    name: tilahun-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate --noinput && python backend/manage.py collectstatic --noinput
    startCommand: gunicorn backend.app:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "tilahun-backend.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://tilahun-frontend.vercel.app"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://tilahun-frontend.vercel.app"
      - key: DJANGO_CORS_ALLOW_ALL_ORIGINS
        value: "0"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "openai"
